name: Build & Deploy Static Site

on:
  push:
    branches: [master]
    paths:
      - "Pilot_Reports/**"
      - "scripts/build_site.py"
      - "scripts/utils.py"
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt markdown

      - name: Build static site
        run: python scripts/build_site.py

      - name: Install Pagefind (optional full-text index)
        run: |
          curl -L https://github.com/CloudCannon/pagefind/releases/latest/download/pagefind-x86_64-unknown-linux-musl.tar.gz | tar xz
          ./pagefind --source site/ || echo "Pagefind indexing failed (non-fatal)"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          commit_message: "Deploy site: ${{ github.sha }}"
